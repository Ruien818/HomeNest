<!DOCTYPE html>
<html lang="fr" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HomeNest — Dictionary</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap"
        rel="stylesheet">

    <style>
        * {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .font-mono {
            font-family: 'JetBrains Mono', monospace;
        }

        body {
            background: #090d16;
            background-image:
                radial-gradient(at 0% 0%, rgba(139, 92, 246, 0.24) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(6, 182, 212, 0.16) 0px, transparent 50%);
            background-attachment: fixed;
            min-height: 100vh;
            color: #f1f5f9;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .glass-input {
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: white;
            transition: all 0.25s ease;
        }

        .glass-input:focus {
            outline: none;
            border-color: rgba(139, 92, 246, 0.65);
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.22);
            background: rgba(0, 0, 0, 0.52);
        }

        .usito-tab {
            transition: all 0.2s ease;
        }

        .usito-tab.active {
            background: rgba(139, 92, 246, 0.28);
            border-color: rgba(167, 139, 250, 0.55);
            color: #f5f3ff;
            box-shadow: 0 4px 16px rgba(139, 92, 246, 0.22);
        }
    </style>
</head>

<body class="min-h-screen p-4 sm:p-6">
    <div class="max-w-5xl mx-auto space-y-6">

        <!-- Top Navigation Bar -->
        <header class="glass-panel rounded-3xl p-4 sm:p-5 flex flex-wrap items-center justify-between gap-4">
            <div class="flex items-center space-x-3.5">
                <div
                    class="w-11 h-11 rounded-2xl bg-violet-500/20 border border-violet-500/40 flex items-center justify-center text-violet-300 text-lg shadow-lg">
                    <i class="fa-solid fa-book-open"></i>
                </div>
                <div>
                    <div class="flex items-center gap-2">
                        <h1 class="font-extrabold text-lg text-white tracking-tight">HomeNest Dictionary</h1>
                        <span id="user-badge"
                            class="px-2.5 py-0.5 rounded-full bg-white/10 border border-white/15 text-[10px] font-bold uppercase tracking-wider text-slate-300">MEMBER</span>
                    </div>
                    <p id="header-subtitle" class="text-xs text-slate-400 font-mono">Usito-Style · Syn &amp; Ant · Verb Conjugation · Private History</p>
                </div>
            </div>

            <div class="flex items-center gap-2.5">
                <a href="/translator"
                    class="px-4 py-2 rounded-xl bg-emerald-500/20 hover:bg-emerald-500/30 border border-emerald-500/40 text-emerald-200 text-xs font-bold transition-all flex items-center space-x-2">
                    <i class="fa-solid fa-language"></i>
                    <span class="hidden sm:inline">Translator</span>
                </a>
                <a href="/"
                    class="px-4 py-2 rounded-xl bg-amber-500/20 hover:bg-amber-500/30 border border-amber-500/40 text-amber-300 text-xs font-bold transition-all flex items-center space-x-2">
                    <i class="fa-solid fa-grip"></i>
                    <span>Hub Launcher</span>
                </a>
                <button onclick="signOut()"
                    class="px-4 py-2 rounded-xl bg-rose-500/20 hover:bg-rose-500/30 border border-rose-500/30 text-rose-300 text-xs font-bold transition-all flex items-center space-x-2">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    <span class="hidden sm:inline">Sign Out</span>
                </button>
            </div>
        </header>

        <!-- Search Box & 18-Language Selector -->
        <section class="glass-panel rounded-3xl p-6 space-y-4 relative z-20">
            <form onsubmit="event.preventDefault(); searchWord();" class="flex flex-col md:flex-row gap-3">
                <div class="relative flex-1">
                    <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                    <input type="text" id="word-input" autocomplete="off"
                        class="w-full glass-input rounded-2xl pl-11 pr-4 py-3.5 text-base font-semibold"
                        placeholder="Rechercher un mot en français..."
                        oninput="handleAutocomplete(this.value)">

                    <!-- Live Autocomplete Dropdown -->
                    <div id="suggestions-box"
                        class="hidden absolute left-0 right-0 top-full mt-2 rounded-2xl bg-slate-900/95 backdrop-blur-xl border border-white/15 shadow-2xl overflow-hidden z-30">
                    </div>
                </div>

                <div class="flex gap-2">
                    <select id="lang-select" onchange="onLanguageChange()"
                        class="glass-input rounded-2xl px-4 py-3.5 text-sm font-bold text-violet-200 cursor-pointer min-w-[185px]">
                        <optgroup label="Main Languages" class="bg-slate-900 text-slate-400">
                            <option value="fr" class="bg-slate-900 text-white" selected>Français (FR)</option>
                            <option value="en" class="bg-slate-900 text-white">English (EN)</option>
                            <option value="es" class="bg-slate-900 text-white">Español (ES)</option>
                            <option value="de" class="bg-slate-900 text-white">Deutsch (DE)</option>
                            <option value="it" class="bg-slate-900 text-white">Italiano (IT)</option>
                            <option value="pt-BR" class="bg-slate-900 text-white">Português (PT)</option>
                        </optgroup>
                        <optgroup label="Asia &amp; Middle East" class="bg-slate-900 text-slate-400">
                            <option value="zh" class="bg-slate-900 text-white">中文 Chinese (ZH)</option>
                            <option value="ja" class="bg-slate-900 text-white">日本語 Japanese (JA)</option>
                            <option value="ko" class="bg-slate-900 text-white">한국어 Korean (KO)</option>
                            <option value="ar" class="bg-slate-900 text-white">العربية Arabic (AR)</option>
                            <option value="hi" class="bg-slate-900 text-white">हिन्दी Hindi (HI)</option>
                            <option value="tr" class="bg-slate-900 text-white">Türkçe Turkish (TR)</option>
                        </optgroup>
                        <optgroup label="Europe &amp; Classics" class="bg-slate-900 text-slate-400">
                            <option value="ru" class="bg-slate-900 text-white">Русский Russian (RU)</option>
                            <option value="nl" class="bg-slate-900 text-white">Nederlands Dutch (NL)</option>
                            <option value="pl" class="bg-slate-900 text-white">Polski Polish (PL)</option>
                            <option value="sv" class="bg-slate-900 text-white">Svenska Swedish (SV)</option>
                            <option value="la" class="bg-slate-900 text-white">Latina Latin (LA)</option>
                            <option value="el" class="bg-slate-900 text-white">Ελληνικά Greek (EL)</option>
                        </optgroup>
                    </select>

                    <button type="submit"
                        class="px-6 py-3.5 rounded-2xl bg-violet-500/30 hover:bg-violet-500/50 border border-violet-500/50 text-violet-100 text-sm font-bold transition-all flex items-center gap-2 whitespace-nowrap">
                        <span id="search-btn-label">Rechercher</span>
                        <i class="fa-solid fa-arrow-right text-xs"></i>
                    </button>
                </div>
            </form>

            <!-- Dynamic Sample Words -->
            <div class="flex flex-wrap items-center gap-2 pt-1">
                <span id="examples-label" class="text-[11px] font-bold uppercase tracking-wider text-slate-400 mr-1">Exemples :</span>
                <div id="starter-chips" class="flex flex-wrap items-center gap-2"></div>
            </div>

            <!-- Account-Private Recent Searches -->
            <div id="private-history-bar" class="hidden flex flex-wrap items-center justify-between gap-2 pt-2.5 border-t border-white/10">
                <div class="flex flex-wrap items-center gap-2">
                    <span class="text-[11px] font-bold uppercase tracking-wider text-cyan-300 flex items-center gap-1.5 mr-1">
                        <i class="fa-solid fa-lock text-[10px]"></i>
                        <span id="recents-label">Historique privé :</span>
                    </span>
                    <div id="recent-chips" class="flex flex-wrap items-center gap-2"></div>
                </div>
                <button onclick="clearPrivateHistory()"
                    class="text-[11px] font-semibold text-rose-300 hover:text-rose-200 transition-colors flex items-center gap-1">
                    <i class="fa-solid fa-trash-can text-[10px]"></i>
                    <span id="clear-history-label">Effacer</span>
                </button>
            </div>
        </section>

        <!-- Results Container -->
        <main id="results-area" class="space-y-5"></main>

    </div>

        let autocompleteTimer = null;
        let currentAudioUrl = null;
        let activeTab = 'all';
        let currentEntryData = null;
        let currentUser = null;
        let recentWords = [];

        function getCurrentCfg() {
            const lang = document.getElementById('lang-select').value;
            return LANGUAGES[lang] || LANGUAGES['fr'];
        }

        function escapeHtml(str) {
            return String(str ?? '').replace(/[&<>"']/g, m => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[m]));
        }

        function stripHtml(htmlStr) {
            const doc = new DOMParser().parseFromString(String(htmlStr ?? ''), 'text/html');
            return (doc.body.textContent || '').replace(/\s+/g, ' ').trim();
        }

        function getAccountStorageKey() {
            if (!currentUser) return null;
            const idPart = currentUser.id ?? currentUser.user_id ?? currentUser.username;
            return `homenest_dict_history_${idPart}`;
        }

        async function loadPrivateHistory() {
            if (!currentUser) return;
            try {
                const res = await fetch('/api/history/dictionary');
                if (res.ok) {
                    const data = await res.json();
                    recentWords = Array.isArray(data.items) ? data.items : [];
                    const key = getAccountStorageKey();
                    if (key) localStorage.setItem(key, JSON.stringify(recentWords));
                    renderRecentChips();
                    return;
                }
            } catch (_) {}

            const key = getAccountStorageKey();
            recentWords = key ? JSON.parse(localStorage.getItem(key) || '[]') : [];
            renderRecentChips();
        }

        async function saveRecentWord(word, lang) {
            if (!currentUser) return;
            const clean = word.trim();
            const entry = { word: clean, lang };
            recentWords = [
                entry,
                ...recentWords.filter(w => !(w.word.toLowerCase() === clean.toLowerCase() && w.lang === lang))
            ].slice(0, 8);
            renderRecentChips();

            const key = getAccountStorageKey();
            if (key) localStorage.setItem(key, JSON.stringify(recentWords));

            try {
                await fetch('/api/history/dictionary', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ item: entry })
                });
            } catch (_) {}
        }

        async function clearPrivateHistory() {
            recentWords = [];
            renderRecentChips();
            const key = getAccountStorageKey();
            if (key) localStorage.removeItem(key);
            try {
                await fetch('/api/history/dictionary', { method: 'DELETE' });
            } catch (_) {}
        }

        async function verifyAuth() {
            // Remove legacy shared localStorage key so history is strictly per-account
            localStorage.removeItem('homenest_dict_recent_v2');
            localStorage.removeItem('homenest_dict_recent');

            try {
                const res = await fetch('/api/me');
                if (!res.ok) {
                    window.location.href = '/';
                    return;
                }
                currentUser = await res.json();
                document.getElementById('user-badge').innerText = `${currentUser.username} · ${currentUser.role}`;
                applyLanguageUI();
                await loadPrivateHistory();
            } catch (_) {
                window.location.href = '/';
            }
        }

        async function signOut() {
            await fetch('/api/logout', { method: 'POST' });
            window.location.href = '/';
        }

        function applyLanguageUI() {
            const lang = document.getElementById('lang-select').value;
            const cfg = getCurrentCfg();
            const ui = cfg.ui;

            document.documentElement.lang = lang;
            document.documentElement.dir = cfg.dir || 'ltr';
            document.getElementById('word-input').placeholder = ui.placeholder;
            document.getElementById('search-btn-label').innerText = ui.searchBtn;
            document.getElementById('examples-label').innerText = ui.examples;
            document.getElementById('clear-history-label').innerText = ui.clearHistory;
            const ownerTag = currentUser ? ` (${currentUser.username})` : '';
            document.getElementById('recents-label').innerText = `${ui.recents}${ownerTag} :`;

            renderStarterChips();
            renderRecentChips();
        }

        function renderEmptyState() {
            const ui = getCurrentCfg().ui;
            document.getElementById('results-area').innerHTML = `
                <div class="glass-panel rounded-3xl p-10 text-center space-y-3">

                        class="w-16 h-16 rounded-2xl bg-violet-500/15 border border-violet-500/30 flex items-center justify-center mx-auto text-violet-300 text-2xl">

        function renderStarterChips() {
            const cfg = getCurrentCfg();
            const box = document.getElementById('starter-chips');
            box.innerHTML = cfg.starters.map(w => `
                <button onclick="quickLookup('${escapeHtml(w)}')"
                    class="px-3 py-1 rounded-full bg-white/5 hover:bg-violet-500/20 border border-white/10 hover:border-violet-500/40 text-xs text-slate-300 transition-all">
                    ${escapeHtml(w)}
                </button>
            `).join('');
        }

        function renderRecentChips() {
            const bar = document.getElementById('private-history-bar');
            const box = document.getElementById('recent-chips');
            if (!recentWords.length) {
                bar.classList.add('hidden');
                box.innerHTML = '';
                return;
            }
            bar.classList.remove('hidden');
            box.innerHTML = recentWords.map(item => `
                <button onclick="quickLookup('${escapeHtml(item.word)}', '${escapeHtml(item.lang)}')"
                    class="px-3 py-1 rounded-full bg-cyan-500/10 hover:bg-cyan-500/25 border border-cyan-500/25 text-xs text-cyan-200 transition-all">
                    ${escapeHtml(item.word)} <span class="opacity-60 text-[10px] uppercase">${escapeHtml(item.lang)}</span>
                </button>
            `).join('');
        }

        function onLanguageChange() {
            applyLanguageUI();
            const currentWord = document.getElementById('word-input').value.trim();
            if (currentWord) {
                searchWord();
            } else {
                currentEntryData = null;
                renderEmptyState();
            }
        }

        function quickLookup(word, langOverride = null) {
            if (langOverride && LANGUAGES[langOverride]) {
                document.getElementById('lang-select').value = langOverride;
                applyLanguageUI();
            }
            document.getElementById('word-input').value = word;
            hideSuggestions();
            searchWord();
        }

        function hideSuggestions() {
            const box = document.getElementById('suggestions-box');
            box.classList.add('hidden');
            box.innerHTML = '';
        }

        function handleAutocomplete(val) {
            clearTimeout(autocompleteTimer);
            const query = val.trim();
            const lang = document.getElementById('lang-select').value;
            const cfg = getCurrentCfg();

            if (query.length < 2) {
                hideSuggestions();
                return;
            }

            autocompleteTimer = setTimeout(async () => {
                try {
                    let suggestions = [];
                    if (lang === 'en' || lang === 'es') {
                        const vParam = lang === 'es' ? 'v=es&' : '';
                        const res = await fetch(`https://api.datamuse.com/words?${vParam}sp=${encodeURIComponent(query)}*&max=6`);
                        const items = await res.json();
                        suggestions = items.map(i => i.word);
                    } else {
                        const wikiCode = cfg.wiki || 'fr';
                        const res = await fetch(`https://${wikiCode}.wiktionary.org/w/api.php?action=opensearch&search=${encodeURIComponent(query)}&limit=6&format=json&origin=*`);
                        const data = await res.json();
                        suggestions = Array.isArray(data[1]) ? data[1] : [];
                    }

                    const box = document.getElementById('suggestions-box');
                    if (!suggestions.length) {
                        hideSuggestions();
                        return;
                    }

                    box.innerHTML = suggestions.map(w => `
                        <button type="button" onclick="quickLookup('${escapeHtml(w)}')"
                            class="w-full text-left px-4 py-2.5 text-sm text-slate-200 hover:bg-violet-500/25 flex items-center justify-between border-b border-white/5 last:border-none transition-colors">
                            <span class="font-medium">${escapeHtml(w)}</span>
                            <span class="text-[11px] font-mono text-slate-400">${escapeHtml(cfg.ui.openHint)}</span>
                        </button>
                    `).join('');
                    box.classList.remove('hidden');
                } catch (_) {
                    hideSuggestions();
                }
            }, 180);
        }

        document.addEventListener('click', (e) => {
            if (!e.target.closest('#word-input') && !e.target.closest('#suggestions-box')) {
                hideSuggestions();
            }
        });

        function playPronunciation() {
            if (currentAudioUrl) {
                const audio = new Audio(currentAudioUrl);
                audio.play().catch(() => speakFallback());
            } else {
                speakFallback();
            }
        }

        function speakFallback() {
            if (!currentEntryData || !('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const utter = new SpeechSynthesisUtterance(currentEntryData.word);
            const cfg = LANGUAGES[currentEntryData.lang] || LANGUAGES['fr'];
            utter.lang = cfg.speech;
            utter.rate = 0.95;
            window.speechSynthesis.speak(utter);
        }

        function conjugateFrenchVerb(rawInfinitive) {

                    imp: [pref + v + 'enais', pref + v + 'enais', pref + v + 'enait', pref + v + 'enions', pref + v + 'eniez', pref + v + 'enaient'],

                    pres: [pref + 'prends', pref + 'prends', pref + 'prend', pref + 'prenons', pref + 'prenez', pref + 'prennent'],
                    imp: [pref + 'prenais', pref + 'prenais', pref + 'prenait', pref + 'prenions', pref + 'preniez', pref + 'prenaient'],
                    fut: [pref + 'prendrai', pref + 'prendras', pref + 'prendra', pref + 'prendrons', pref + 'prendrez', pref + 'prendront'],
                    cond: [pref + 'prendrais', pref + 'prendrais', pref + 'prendrait', pref + 'prendrions', pref + 'prendriez', pref + 'prendraient'],
                    subj: [pref + 'prenne', pref + 'prennes', pref + 'prenne', pref + 'prenions', pref + 'preniez', pref + 'prennent']

            } else if (clean.endsWith('ir')) {
                const stem = clean.slice(0, -2);
                data = {
                    group: '2e groupe (-ir)',
                    aux: FR_ETRE_VERBS.has(clean) ? 'être' : 'avoir',
                    pp: stem + 'i',
                    ppres: stem + 'issant',
                    pres: [stem + 'is', stem + 'is', stem + 'it', stem + 'issons', stem + 'issez', stem + 'issent'],

        }

        const EN_IRREGULAR = {
            'be': ['was / were', 'been', 'being'], 'have': ['had', 'had', 'having'], 'do': ['did', 'done', 'doing'],
            'go': ['went', 'gone', 'going'], 'say': ['said', 'said', 'saying'], 'get': ['got', 'gotten / got', 'getting'],

        function conjugateEnglishVerb(rawBase) {
            const base = rawBase.trim().toLowerCase().replace(/^to\s+/, '');
            if (!base || /\s/.test(base)) return null;

            let third = base + 's';
            if (base === 'be') third = 'is';
            else if (base === 'have') third = 'has';
            else if (base === 'do') third = 'does';
            else if (base === 'go') third = 'goes';
            else if (/[^aeiou]y$/.test(base)) third = base.slice(0, -1) + 'ies';
            else if (/(s|sh|ch|x|z|o)$/.test(base)) third = base + 'es';

            let past, pp, ing;
            if (EN_IRREGULAR[base]) {
                [past, pp, ing] = EN_IRREGULAR[base];
            } else {
                if (base.endsWith('e') && !base.endsWith('ee')) {
                    past = base + 'd';
                    ing = base.slice(0, -1) + 'ing';
                } else if (/[^aeiou]y$/.test(base)) {
                    past = base.slice(0, -1) + 'ied';
                    ing = base + 'ing';
                } else if (/^[^aeiou]*[aeiou][^aeiouwxy]$/.test(base) && base.length >= 3) {
                    const last = base.slice(-1);
                    past = base + last + 'ed';
                    ing = base + last + 'ing';
                } else {
                    past = base + 'ed';
                    ing = base + 'ing';
                }
                pp = past;
            }

            const presRows = base === 'be'
                ? ['I am', 'you are', 'he / she / it is', 'we are', 'they are']
                : [`I ${base}`, `you ${base}`, `he / she / it ${third}`, `we ${base}`, `they ${base}`];

            const pastRows = base === 'be'
                ? ['I was', 'you were', 'he / she / it was', 'we were', 'they were']
                : [`I ${past}`, `you ${past}`, `he / she / it ${past}`, `we ${past}`, `they ${past}`];

                meta: [
                    { label: 'Base Form', value: base },

                    { title: 'Simple Past', rows: pastRows },

                    { title: 'Present Perfect', rows: [`I have ${pp}`, `you have ${pp}`, `he / she has ${pp}`, `we have ${pp}`, `they have ${pp}`] },
                    { title: 'Conditional', rows: [`I would ${base}`, `you would ${base}`, `he / she would ${base}`, `we would ${base}`, `they would ${base}`] }
                ]

        function conjugateRomanceOrGerman(word, lang) {
            const w = word.trim().toLowerCase();
            if (lang === 'es' && /(ar|er|ir)$/.test(w)) {
                const stem = w.slice(0, -2);
                const type = w.slice(-2);
                const presEnd = type === 'ar' ? ['o', 'as', 'a', 'amos', 'áis', 'an'] : (type === 'er' ? ['o', 'es', 'e', 'emos', 'éis', 'en'] : ['o', 'es', 'e', 'imos', 'ís', 'en']);

                const futEnd = ['é', 'ás', 'á', 'emos', 'éis', 'án'];
                const subj = ['yo', 'tú', 'él / ella', 'nosotros', 'vosotros', 'ellos'];

                    meta: [{ label: 'Infinitivo', value: w }, { label: 'Conjugación', value: `-${type}` }],
                    tenses: [
                        { title: 'Presente', rows: subj.map((s, i) => `${s} ${stem}${presEnd[i]}`) },

                        { title: 'Futuro simple', rows: subj.map((s, i) => `${s} ${w}${futEnd[i]}`) }
                    ]

            if (lang === 'it' && /(are|ere|ire)$/.test(w)) {
                const stem = w.slice(0, -3);
                const type = w.slice(-3);
                const presEnd = type === 'are' ? ['o', 'i', 'a', 'iamo', 'ate', 'ano'] : (type === 'ere' ? ['o', 'i', 'e', 'iamo', 'ete', 'ono'] : ['o', 'i', 'e', 'iamo', 'ite', 'ono']);

                const subj = ['io', 'tu', 'lui / lei', 'noi', 'voi', 'loro'];
                return {
                    meta: [{ label: 'Infinito', value: w }, { label: 'Coniugazione', value: `-${type}` }],
                    tenses: [
                        { title: 'Presente', rows: subj.map((s, i) => `${s} ${stem}${presEnd[i]}`) },

            }
            if (lang === 'pt-BR' && /(ar|er|ir)$/.test(w)) {
                const stem = w.slice(0, -2);
                const type = w.slice(-2);
                const presEnd = type === 'ar' ? ['o', 'as', 'a', 'amos', 'ais', 'am'] : (type === 'er' ? ['o', 'es', 'e', 'emos', 'eis', 'em'] : ['o', 'es', 'e', 'imos', 'is', 'em']);
                const futEnd = ['ei', 'ás', 'á', 'emos', 'eis', 'ão'];
                const subj = ['eu', 'tu', 'ele / ela', 'nós', 'vós', 'eles'];
                return {
                    meta: [{ label: 'Infinitivo', value: w }, { label: 'Conjugação', value: `-${type}` }],
                    tenses: [
                        { title: 'Presente', rows: subj.map((s, i) => `${s} ${stem}${presEnd[i]}`) },
                        { title: 'Futuro do presente', rows: subj.map((s, i) => `${s} ${w}${futEnd[i]}`) }
                    ]
                };
            }
            if (lang === 'de' && /en$/.test(w) && w.length > 3) {
                const stem = w.slice(0, -2);
                const eInsert = /[dt]$/.test(stem) ? 'e' : '';
                const subj = ['ich', 'du', 'er / sie / es', 'wir', 'ihr', 'sie / Sie'];
                const presEnd = ['e', `${eInsert}st`, `${eInsert}t`, 'en', `${eInsert}t`, 'en'];
                const pratEnd = [`${eInsert}te`, `${eInsert}test`, `${eInsert}te`, `${eInsert}ten`, `${eInsert}tet`, `${eInsert}ten`];
                return {
                    meta: [{ label: 'Infinitiv', value: w }, { label: 'Partizip II', value: `ge${stem}${eInsert}t` }],
                    tenses: [
                        { title: 'Präsens', rows: subj.map((s, i) => `${s} ${stem}${presEnd[i]}`) },
                        { title: 'Präteritum', rows: subj.map((s, i) => `${s} ${stem}${pratEnd[i]}`) },
                        { title: 'Futur I', rows: ['ich werde ' + w, 'du wirst ' + w, 'er / sie wird ' + w, 'wir werden ' + w, 'ihr werdet ' + w, 'sie werden ' + w] }
                    ]
                };
            }
            return null;
        }

        function buildVerbConjugation(word, lang) {
            if (lang === 'fr') return conjugateFrenchVerb(word);
            if (lang === 'en') return conjugateEnglishVerb(word);
            return conjugateRomanceOrGerman(word, lang);
        }

        async function fetchWiktionaryRest(wikiLang, targetLangKey, word) {
            try {
                const res = await fetch(`https://${wikiLang}.wiktionary.org/api/rest_v1/page/definition/${encodeURIComponent(word)}`);
                if (!res.ok) return null;
                const data = await res.json();

                const buckets = data[targetLangKey] || data[wikiLang] || data['other'] || Object.values(data)[0];
                if (!Array.isArray(buckets) || !buckets.length) return null;

                const meanings = buckets.map(b => ({
                    partOfSpeech: b.partOfSpeech || 'term',
                    definitions: (b.definitions || []).map(d => ({
                        definition: stripHtml(d.definition),
                        example: Array.isArray(d.examples) && d.examples.length ? stripHtml(d.examples[0]) : '',
                        synonyms: [],
                        antonyms: []
                    })).filter(d => d.definition),
                    synonyms: [],
                    antonyms: []
                })).filter(m => m.definitions.length > 0);

                return meanings.length ? meanings : null;
            } catch (_) {
                return null;
            }
        }

        async function fetchWiktionarySynAnt(wikiLang, word) {
            const synonyms = new Set();
            const antonyms = new Set();
            try {
                const url = `https://${wikiLang}.wiktionary.org/w/api.php?action=parse&page=${encodeURIComponent(word)}&prop=text&format=json&origin=*`;
                const res = await fetch(url);
                if (!res.ok) return { synonyms: [], antonyms: [] };
                const json = await res.json();
                const html = json?.parse?.text?.['*'];
                if (!html) return { synonyms: [], antonyms: [] };

                const doc = new DOMParser().parseFromString(html, 'text/html');
                const headings = doc.querySelectorAll('h2, h3, h4, h5');
                headings.forEach(h => {
                    const label = h.textContent.toLowerCase();
                    const isSyn = /synonyme|synonym|sinónimo|sinonimo|sinônimo|синоним|同義語|同义词|유의어/.test(label);
                    const isAnt = /antonyme|antonym|antónimo|antonimo|antônimo|антоним|対義語|反义词|반의어/.test(label);
                    if (!isSyn && !isAnt) return;

                    let el = h.parentElement?.classList?.contains('mw-heading') ? h.parentElement.nextElementSibling : h.nextElementSibling;
                    let steps = 0;
                    while (el && steps < 4) {
                        if (/^H[2-5]$/.test(el.tagName) || el.classList?.contains('mw-heading')) break;
                        el.querySelectorAll('li a, dd a').forEach(a => {
                            const txt = a.textContent.trim();
                            if (txt && txt.length < 40 && !txt.includes(':') && !/^\d+$/.test(txt)) {
                                if (isSyn) synonyms.add(txt);
                                if (isAnt) antonyms.add(txt);
                            }
                        });
                        if ((isSyn && synonyms.size > 0) || (isAnt && antonyms.size > 0)) break;
                        el = el.nextElementSibling;
                        steps++;
                    }
                });
            } catch (_) {}
            return { synonyms: [...synonyms].slice(0, 24), antonyms: [...antonyms].slice(0, 24) };
        }

        async function fetchDatamuseLexicon(lang, word) {
            const synonyms = [];
            const antonyms = [];
            const related = [];
            try {
                if (lang === 'en') {
                    const [synRes, antRes, relRes] = await Promise.all([
                        fetch(`https://api.datamuse.com/words?rel_syn=${encodeURIComponent(word)}&max=20`),
                        fetch(`https://api.datamuse.com/words?rel_ant=${encodeURIComponent(word)}&max=20`),
                        fetch(`https://api.datamuse.com/words?ml=${encodeURIComponent(word)}&max=16`)
                    ]);
                    if (synRes.ok) (await synRes.json()).forEach(x => synonyms.push(x.word));
                    if (antRes.ok) (await antRes.json()).forEach(x => antonyms.push(x.word));
                    if (relRes.ok) (await relRes.json()).forEach(x => related.push(x.word));
                } else if (lang === 'es') {
                    const relRes = await fetch(`https://api.datamuse.com/words?v=es&ml=${encodeURIComponent(word)}&max=18`);
                    if (relRes.ok) (await relRes.json()).forEach(x => related.push(x.word));
                }
            } catch (_) {}
            return { synonyms, antonyms, related };
        }

        async function searchWord() {
            const rawWord = document.getElementById('word-input').value.trim();
            const lang = document.getElementById('lang-select').value;
            const cfg = getCurrentCfg();
            const ui = cfg.ui;
            const resultsArea = document.getElementById('results-area');
            hideSuggestions();

            if (!rawWord) {
                renderEmptyState();
                return;
            }
            activeTab = 'all';

            resultsArea.innerHTML = `
                <div class="glass-panel rounded-3xl p-10 text-center space-y-3">
                    <i class="fa-solid fa-circle-notch fa-spin text-2xl text-violet-400"></i>
                    <p class="text-sm text-slate-300 font-medium">${escapeHtml(ui.loading)} « ${escapeHtml(rawWord)} » (${escapeHtml(cfg.name)})...</p>
                </div>
            `;

            const queryWord = lang === 'de' ? rawWord : rawWord.toLowerCase();
            let meanings = [];
            let phoneticText = '';
            let originText = '';
            let headword = rawWord;
            let sourcesUsed = [];
            currentAudioUrl = null;

            const synSet = new Set();
            const antSet = new Set();
            const relSet = new Set();

            const dictTask = cfg.dictApi
                ? fetch(`https://api.dictionaryapi.dev/api/v2/entries/${cfg.dictApi}/${encodeURIComponent(queryWord)}`)
                    .then(r => r.ok ? r.json() : null)
                    .catch(() => null)
                : Promise.resolve(null);

            const wikiSynAntTask = fetchWiktionarySynAnt(cfg.wiki, rawWord);
            const datamuseTask = fetchDatamuseLexicon(lang, queryWord);

            const [dictEntries, wikiSynAnt, dmLex] = await Promise.all([dictTask, wikiSynAntTask, datamuseTask]);

            if (Array.isArray(dictEntries) && dictEntries.length) {
                sourcesUsed.push('Free Dictionary API');
                headword = dictEntries[0].word || rawWord;
                for (const entry of dictEntries) {
                    if (!originText && entry.origin) originText = entry.origin;
                    for (const p of (entry.phonetics || [])) {
                        if (!phoneticText && p.text) phoneticText = p.text;
                        if (!currentAudioUrl && p.audio) {
                            currentAudioUrl = p.audio.startsWith('//') ? 'https:' + p.audio : p.audio;
                        }
                    }
                    for (const m of (entry.meanings || [])) {
                        (m.synonyms || []).forEach(s => synSet.add(s));
                        (m.antonyms || []).forEach(a => antSet.add(a));
                        (m.definitions || []).forEach(d => {
                            (d.synonyms || []).forEach(s => synSet.add(s));
                            (d.antonyms || []).forEach(a => antSet.add(a));
                        });
                        meanings.push(m);
                    }
                }
            }

            if (!meanings.length) {
                let wikiMeanings = await fetchWiktionaryRest(cfg.wiki, cfg.wiki, rawWord);
                if (!wikiMeanings && cfg.wiki !== 'en') {
                    wikiMeanings = await fetchWiktionaryRest('en', cfg.wiki, rawWord);
                }
                if (wikiMeanings) {
                    meanings = wikiMeanings;
                    sourcesUsed.push(`Wiktionary (${cfg.wiki.toUpperCase()})`);
                }
            }

            // Fallback for French pronominal verbs like "se lever" -> lookup base "lever" if needed
            if (!meanings.length && lang === 'fr' && /^(se |s'|s’)/i.test(rawWord)) {
                const baseVerb = rawWord.replace(/^(se |s'|s’)/i, '').trim();
                const baseMeanings = await fetchWiktionaryRest('fr', 'fr', baseVerb);
                if (baseMeanings) {
                    meanings = baseMeanings;
                    sourcesUsed.push('Wiktionary (FR)');
                }
            }

            wikiSynAnt.synonyms.forEach(s => synSet.add(s));
            wikiSynAnt.antonyms.forEach(a => antSet.add(a));
            if (wikiSynAnt.synonyms.length || wikiSynAnt.antonyms.length) {
                sourcesUsed.push('Wiktionary Syn/Ant');
            }

            dmLex.synonyms.forEach(s => synSet.add(s));
            dmLex.antonyms.forEach(a => antSet.add(a));
            dmLex.related.forEach(r => {
                if (r.toLowerCase() !== headword.toLowerCase() && !synSet.has(r)) relSet.add(r);
            });
            if (dmLex.synonyms.length || dmLex.antonyms.length || dmLex.related.length) {
                sourcesUsed.push('Datamuse');
            }

            const cleanFilter = w => w && w.toLowerCase() !== headword.toLowerCase();
            const synonyms = [...synSet].filter(cleanFilter);
            const antonyms = [...antSet].filter(cleanFilter);
            const related = [...relSet].filter(cleanFilter);

            const tempEntry = { word: headword, lang, meanings };
            const isVerb = isVerbEntry(tempEntry);
            const conjugation = isVerb ? buildVerbConjugation(headword, lang) : null;

            if (!meanings.length && !synonyms.length && !antonyms.length && !conjugation) {
                resultsArea.innerHTML = `
                    <div class="glass-panel rounded-3xl p-8 text-center space-y-3 border border-rose-500/30 bg-rose-500/5">
                        <i class="fa-solid fa-circle-exclamation text-2xl text-rose-400"></i>
                        <h3 class="text-base font-bold text-white">${escapeHtml(ui.notFound)} « ${escapeHtml(rawWord)} » (${escapeHtml(cfg.name)})</h3>
                        <p class="text-xs text-slate-400">${escapeHtml(ui.notFoundHint)}</p>
                    </div>
                `;
                return;
            }

            await saveRecentWord(headword, lang);

            currentEntryData = {
                word: headword,
                lang,
                langName: cfg.name,
                phonetic: phoneticText,
                origin: originText,
                usageNote: '',
                meanings,
                synonyms,
                antonyms,
                related,
                isVerb,
                conjugation,
                sources: [...new Set(sourcesUsed)]
            };

            renderUsitoArticle(currentEntryData);
        }

                            </div>
                        </div>

                        <div class="flex items-center gap-2.5 flex-wrap">
                            <button onclick="playPronunciation()"
                                class="px-4 py-2.5 rounded-2xl bg-cyan-500/20 hover:bg-cyan-500/35 border border-cyan-500/40 text-cyan-200 text-xs font-bold transition-all flex items-center gap-2">
                                <i class="fa-solid fa-volume-high"></i>
                                <span>${escapeHtml(ui.pronounce)}</span>
                            </button>
                            <button id="ai-enrich-btn" onclick="enrichWithLmStudio()"
                                class="px-4 py-2.5 rounded-2xl bg-violet-500/20 hover:bg-violet-500/35 border border-violet-500/40 text-violet-200 text-xs font-bold transition-all flex items-center gap-2">
                                <i class="fa-solid fa-wand-magic-sparkles"></i>
                                <span>${escapeHtml(ui.enrichBtn)}</span>
                            </button>
                        </div>
                    </div>

                    ${entry.usageNote ? `
                        <div class="p-3.5 rounded-2xl bg-amber-500/10 border border-amber-500/30 text-xs text-amber-100 flex items-start gap-2.5">
                            <i class="fa-solid fa-circle-info text-amber-300 mt-0.5"></i>
                            <div><strong>${escapeHtml(ui.usageNote)}</strong> ${escapeHtml(entry.usageNote)}</div>
                        </div>
                    ` : `<div id="ai-usito-box"></div>`}

                    <!-- SECTION TABS -->
                    <div class="flex flex-wrap items-center gap-2 pt-2 border-t border-white/10">
                        <button onclick="setUsitoTab('all')"
                            class="usito-tab ${activeTab === 'all' ? 'active' : ''} px-3.5 py-1.5 rounded-xl bg-white/5 border border-white/10 text-xs font-bold text-slate-300">
                            ${escapeHtml(ui.tabAll)}
                        </button>
                        <button onclick="setUsitoTab('defs')"
                            class="usito-tab ${activeTab === 'defs' ? 'active' : ''} px-3.5 py-1.5 rounded-xl bg-white/5 border border-white/10 text-xs font-bold text-slate-300">
                            ${escapeHtml(ui.tabDefs)} (${entry.meanings.reduce((acc, m) => acc + (m.definitions?.length || 0), 0)})
                        </button>
                        <button onclick="setUsitoTab('synant')"
                            class="usito-tab ${activeTab === 'synant' ? 'active' : ''} px-3.5 py-1.5 rounded-xl bg-white/5 border border-white/10 text-xs font-bold text-slate-300 flex items-center gap-1.5">
                            <span>${escapeHtml(ui.tabSynAnt)}</span>
                            <span class="px-1.5 py-0.2 rounded-full bg-emerald-500/25 text-emerald-200 text-[10px]">${synCount}/${antCount}</span>
                        </button>
                        ${showVerbSection ? `
                            <button onclick="setUsitoTab('conj')"
                                class="usito-tab ${activeTab === 'conj' ? 'active' : ''} px-3.5 py-1.5 rounded-xl bg-amber-500/15 border border-amber-500/35 text-xs font-bold text-amber-200 flex items-center gap-1.5">
                                <i class="fa-solid fa-table-cells text-[11px]"></i>
                                <span>${escapeHtml(ui.tabConj)}</span>
                            </button>
                        ` : ''}
                        <button onclick="setUsitoTab('examples')"
                            class="usito-tab ${activeTab === 'examples' ? 'active' : ''} px-3.5 py-1.5 rounded-xl bg-white/5 border border-white/10 text-xs font-bold text-slate-300">
                            ${escapeHtml(ui.tabExamples)} (${allExamples.length})
                        </button>
                        <button onclick="setUsitoTab('etymo')"
                            class="usito-tab ${activeTab === 'etymo' ? 'active' : ''} px-3.5 py-1.5 rounded-xl bg-white/5 border border-white/10 text-xs font-bold text-slate-300">
                            ${escapeHtml(ui.tabEtymo)}
                        </button>
                    </div>
                </div>

                <!-- 2. CONJUGATED VERB SECTION (SHOWN AUTOMATICALLY WHEN WORD IS A VERB) -->
                ${conjugationHtml}

                <!-- 3. SYN. & ANT. + LEXICAL FIELD -->
                ${showSynAnt ? `
                    <section class="glass-panel rounded-3xl p-6 space-y-5">
                        <div class="flex items-center justify-between gap-2">
                            <h3 class="text-base font-extrabold text-white flex items-center gap-2">
                                <i class="fa-solid fa-arrows-left-right text-emerald-400"></i>
                                <span>${escapeHtml(ui.synAntHeading)}</span>
                            </h3>
                            <span class="text-[11px] font-mono text-slate-400">${escapeHtml(ui.clickWordHint)}</span>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <!-- SYNONYMS -->
                            <div class="p-4 rounded-2xl bg-emerald-500/[0.06] border border-emerald-500/25 space-y-3">
                                <div class="flex items-center justify-between">
                                    <span class="text-xs font-extrabold uppercase tracking-wider text-emerald-300 flex items-center gap-1.5">
                                        <span class="px-2 py-0.5 rounded bg-emerald-500/20 border border-emerald-500/40">${escapeHtml(ui.synBadge)}</span>
                                        <span>${escapeHtml(ui.synTitle)}</span>
                                    </span>
                                    <span class="font-mono text-xs text-emerald-300/80">${synCount}</span>
                                </div>
                                ${synCount ? `
                                    <div class="flex flex-wrap gap-2">
                                        ${entry.synonyms.map(s => `
                                            <button onclick="quickLookup('${escapeHtml(s)}')"
                                                class="px-3 py-1.5 rounded-xl bg-emerald-500/15 hover:bg-emerald-500/30 border border-emerald-500/35 text-emerald-100 text-xs font-semibold transition-all">
                                                ${escapeHtml(s)}
                                            </button>
                                        `).join('')}
                                    </div>
                                ` : `
                                    <p class="text-xs text-slate-400">${escapeHtml(ui.noSyn)}</p>
                                `}
                            </div>

                            <!-- ANTONYMS -->
                            <div class="p-4 rounded-2xl bg-rose-500/[0.06] border border-rose-500/25 space-y-3">
                                <div class="flex items-center justify-between">
                                    <span class="text-xs font-extrabold uppercase tracking-wider text-rose-300 flex items-center gap-1.5">
                                        <span class="px-2 py-0.5 rounded bg-rose-500/20 border border-rose-500/40">${escapeHtml(ui.antBadge)}</span>
                                        <span>${escapeHtml(ui.antTitle)}</span>
                                    </span>
                                    <span class="font-mono text-xs text-rose-300/80">${antCount}</span>
                                </div>
                                ${antCount ? `
                                    <div class="flex flex-wrap gap-2">
                                        ${entry.antonyms.map(a => `
                                            <button onclick="quickLookup('${escapeHtml(a)}')"
                                                class="px-3 py-1.5 rounded-xl bg-rose-500/15 hover:bg-rose-500/30 border border-rose-500/35 text-rose-100 text-xs font-semibold transition-all">
                                                ${escapeHtml(a)}
                                            </button>
                                        `).join('')}
                                    </div>
                                ` : `
                                    <p class="text-xs text-slate-400">${escapeHtml(ui.noAnt)}</p>
                                `}
                            </div>
                        </div>

                        ${entry.related.length ? `
                            <div class="p-4 rounded-2xl bg-cyan-500/[0.05] border border-cyan-500/20 space-y-2.5">
                                <div class="text-xs font-extrabold uppercase tracking-wider text-cyan-300">
                                    ${escapeHtml(ui.relatedTitle)}
                                </div>
                                <div class="flex flex-wrap gap-2">
                                    ${entry.related.map(r => `
                                        <button onclick="quickLookup('${escapeHtml(r)}')"
                                            class="px-2.5 py-1 rounded-lg bg-cyan-500/10 hover:bg-cyan-500/25 border border-cyan-500/25 text-cyan-200 text-xs transition-all">
                                            ${escapeHtml(r)}
                                        </button>
                                    `).join('')}
                                </div>
                            </div>
                        ` : ''}
                    </section>
                ` : ''}

                <!-- 4. DEFINITIONS -->
                ${showDefs && entry.meanings.length ? `
                    <section class="glass-panel rounded-3xl p-6 space-y-5">
                        <h3 class="text-base font-extrabold text-white flex items-center gap-2">
                            <i class="fa-solid fa-list-ol text-violet-400"></i>
                            <span>${escapeHtml(ui.defsHeading)}</span>
                        </h3>
                        <div class="space-y-6">${defsSectionHtml}</div>
                    </section>
                ` : ''}

                <!-- 5. EXAMPLES -->
                ${showExamples ? `
                    <section class="glass-panel rounded-3xl p-6 space-y-4">
                        <h3 class="text-base font-extrabold text-white flex items-center gap-2">
                            <i class="fa-solid fa-quote-left text-cyan-400"></i>
                            <span>${escapeHtml(ui.examplesHeading)}</span>
                        </h3>
                        ${allExamples.length ? `
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                ${allExamples.map(ex => `
                                    <div class="p-3.5 rounded-2xl bg-white/[0.03] border border-white/10 space-y-1">
                                        <span class="text-[10px] font-bold uppercase tracking-wider text-indigo-300">${escapeHtml(ex.pos)}</span>
                                        <p class="text-xs sm:text-sm text-slate-200 italic leading-relaxed">« ${escapeHtml(ex.text)} »</p>
                                    </div>
                                `).join('')}
                            </div>
                        ` : `
                            <p class="text-xs text-slate-400">${escapeHtml(ui.noExamples)}</p>
                        `}
                    </section>
                ` : ''}

                <!-- 6. ETYMOLOGY -->
                ${showEtymo ? `
                    <section class="glass-panel rounded-3xl p-6 space-y-3">
                        <h3 class="text-base font-extrabold text-white flex items-center gap-2">
                            <i class="fa-solid fa-landmark text-amber-400"></i>
                            <span>${escapeHtml(ui.etymoHeading)}</span>
                        </h3>
                        <p class="text-xs sm:text-sm text-slate-300 leading-relaxed">
                            ${entry.origin ? escapeHtml(entry.origin) : escapeHtml(ui.noEtymo)}
                        </p>
                    </section>
                ` : ''}
            `;
        }

        document.addEventListener('DOMContentLoaded', () => {
            applyLanguageUI();
            renderEmptyState();
            verifyAuth();
        });
    </script>
</body>

</html>
