<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HomeNest — Translator</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap"
        rel="stylesheet">

    <style>
        * {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .font-mono {
            font-family: 'JetBrains Mono', monospace;
        }

        body {
            background: #090d16;
            background-image:
                radial-gradient(at 0% 0%, rgba(16, 185, 129, 0.22) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(56, 189, 248, 0.16) 0px, transparent 50%);
            background-attachment: fixed;
            min-height: 100vh;
            color: #f1f5f9;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .glass-input {
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: white;
            transition: all 0.25s ease;
        }

        .glass-input:focus {
            outline: none;
            border-color: rgba(16, 185, 129, 0.65);
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.2);
            background: rgba(0, 0, 0, 0.5);
        }
    </style>
</head>

<body class="min-h-screen p-4 sm:p-6">
    <div class="max-w-5xl mx-auto space-y-6">

        <!-- Top Navigation Bar -->
        <header class="glass-panel rounded-3xl p-4 sm:p-5 flex flex-wrap items-center justify-between gap-4">
            <div class="flex items-center space-x-3.5">
                <div
                    class="w-11 h-11 rounded-2xl bg-emerald-500/20 border border-emerald-500/40 flex items-center justify-center text-emerald-300 text-lg shadow-lg">
                    <i class="fa-solid fa-language"></i>
                </div>
                <div>
                    <div class="flex items-center gap-2">
                        <h1 class="font-extrabold text-lg text-white tracking-tight">HomeNest Translator</h1>
                        <span id="user-badge"
                            class="px-2.5 py-0.5 rounded-full bg-white/10 border border-white/15 text-[10px] font-bold uppercase tracking-wider text-slate-300">MEMBER</span>
                    </div>
                    <p class="text-xs text-slate-400 font-mono">18+ Languages · Auto-Detect · Private Account History</p>
                </div>
            </div>

            <div class="flex items-center gap-2.5">
                <a href="/dictionary"
                    class="px-4 py-2 rounded-xl bg-violet-500/20 hover:bg-violet-500/30 border border-violet-500/40 text-violet-200 text-xs font-bold transition-all flex items-center space-x-2">
                    <i class="fa-solid fa-book-open"></i>
                    <span class="hidden sm:inline">Dictionary</span>
                </a>
                <a href="/"
                    class="px-4 py-2 rounded-xl bg-amber-500/20 hover:bg-amber-500/30 border border-amber-500/40 text-amber-300 text-xs font-bold transition-all flex items-center space-x-2">
                    <i class="fa-solid fa-grip"></i>
                    <span>Hub Launcher</span>
                </a>
                <button onclick="signOut()"
                    class="px-4 py-2 rounded-xl bg-rose-500/20 hover:bg-rose-500/30 border border-rose-500/30 text-rose-300 text-xs font-bold transition-all flex items-center space-x-2">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    <span class="hidden sm:inline">Sign Out</span>
                </button>
            </div>
        </header>

        <!-- Language Selector Bar -->
        <section class="glass-panel rounded-3xl p-4 sm:p-5 flex flex-col sm:flex-row items-center justify-between gap-3">
            <div class="w-full sm:flex-1 flex items-center gap-2">
                <select id="source-lang" onchange="onLangChanged()"
                    class="w-full glass-input rounded-2xl px-4 py-3 text-sm font-bold text-emerald-200 cursor-pointer">
                </select>
                <span id="detected-badge"
                    class="hidden px-2.5 py-1.5 rounded-xl bg-emerald-500/15 border border-emerald-500/30 text-emerald-300 text-[11px] font-mono whitespace-nowrap">
                    Detected: EN
                </span>
            </div>

            <button onclick="swapLanguages()" title="Swap languages"
                class="w-11 h-11 rounded-2xl bg-white/10 hover:bg-emerald-500/25 border border-white/15 hover:border-emerald-500/45 text-slate-200 hover:text-emerald-200 flex items-center justify-center transition-all flex-shrink-0">
                <i class="fa-solid fa-right-left"></i>
            </button>

            <div class="w-full sm:flex-1 flex items-center gap-2">
                <select id="target-lang" onchange="onLangChanged()"
                    class="w-full glass-input rounded-2xl px-4 py-3 text-sm font-bold text-cyan-200 cursor-pointer">
                </select>
            </div>
        </section>

        <!-- Dual Translation Panes -->
        <section class="grid grid-cols-1 lg:grid-cols-2 gap-5">
            <!-- Source Input Card -->
            <div class="glass-panel rounded-3xl p-5 flex flex-col justify-between space-y-3 min-h-[270px]">
                <div class="flex items-center justify-between">
                    <span class="text-xs font-extrabold uppercase tracking-wider text-emerald-300">Source Text</span>
                    <div class="flex items-center gap-2">
                        <button onclick="pasteFromClipboard()"
                            class="px-2.5 py-1 rounded-lg bg-white/5 hover:bg-white/15 border border-white/10 text-[11px] font-semibold text-slate-300 transition-all flex items-center gap-1.5">
                            <i class="fa-regular fa-paste"></i>
                            <span>Paste</span>
                        </button>
                        <button onclick="clearSource()"
                            class="px-2.5 py-1 rounded-lg bg-white/5 hover:bg-rose-500/20 border border-white/10 hover:border-rose-500/35 text-[11px] font-semibold text-slate-300 hover:text-rose-200 transition-all flex items-center gap-1.5">
                            <i class="fa-solid fa-xmark"></i>
                            <span>Clear</span>
                        </button>
                    </div>
                </div>

                <textarea id="source-text" rows="6"
                    class="w-full flex-1 bg-transparent resize-none text-base sm:text-lg text-white placeholder-slate-500 focus:outline-none leading-relaxed"
                    placeholder="Type or paste text to translate..."
                    oninput="handleSourceInput()"></textarea>

                <div id="source-romanization" class="hidden text-xs font-mono text-slate-400 bg-white/5 rounded-xl px-3 py-2"></div>

                <div class="flex items-center justify-between pt-2 border-t border-white/10">
                    <div class="flex items-center gap-2">
                        <button onclick="speakText('source')"
                            class="px-3 py-1.5 rounded-xl bg-white/5 hover:bg-emerald-500/20 border border-white/10 hover:border-emerald-500/40 text-xs font-bold text-slate-200 transition-all flex items-center gap-1.5">
                            <i class="fa-solid fa-volume-high text-emerald-400"></i>
                            <span>Listen</span>
                        </button>
                        <span id="char-count" class="text-[11px] font-mono text-slate-400">0 / 5000</span>
                    </div>

                    <button onclick="translateText(true)"
                        class="px-5 py-2 rounded-xl bg-emerald-500/30 hover:bg-emerald-500/50 border border-emerald-500/50 text-emerald-100 text-xs font-bold transition-all flex items-center gap-2">
                        <span>Translate</span>
                        <i class="fa-solid fa-arrow-right text-[11px]"></i>
                    </button>
                </div>
            </div>

            <!-- Target Output Card -->
            <div class="glass-panel rounded-3xl p-5 flex flex-col justify-between space-y-3 min-h-[270px] border-cyan-500/20">
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-2">
                        <span class="text-xs font-extrabold uppercase tracking-wider text-cyan-300">Translation</span>
                        <span id="engine-tag" class="text-[10px] font-mono px-2 py-0.5 rounded-full bg-white/5 border border-white/10 text-slate-400">Ready</span>
                    </div>
                    <button id="copy-btn" onclick="copyTranslation()"
                        class="px-3 py-1 rounded-lg bg-cyan-500/15 hover:bg-cyan-500/30 border border-cyan-500/35 text-[11px] font-bold text-cyan-200 transition-all flex items-center gap-1.5">
                        <i class="fa-regular fa-copy"></i>
                        <span id="copy-label">Copy</span>
                    </button>
                </div>

                <div id="target-output"
                    class="w-full flex-1 text-base sm:text-lg text-slate-100 leading-relaxed whitespace-pre-wrap break-words select-text">
                    <span class="text-slate-500 text-sm">Translation will appear here...</span>
                </div>

                <div id="target-romanization" class="hidden text-xs font-mono text-cyan-200/80 bg-cyan-500/10 border border-cyan-500/20 rounded-xl px-3 py-2"></div>

                <div class="flex flex-wrap items-center justify-between gap-2 pt-2 border-t border-white/10">
                    <button onclick="speakText('target')"
                        class="px-3 py-1.5 rounded-xl bg-white/5 hover:bg-cyan-500/20 border border-white/10 hover:border-cyan-500/40 text-xs font-bold text-slate-200 transition-all flex items-center gap-1.5">
                        <i class="fa-solid fa-volume-high text-cyan-400"></i>
                        <span>Pronounce</span>
                    </button>

                    <!-- Optional LM Studio Tone Rewrites -->
                    <div class="flex items-center gap-1.5 flex-wrap">
                        <span class="text-[10px] font-mono text-slate-400 mr-0.5">AI Tone:</span>
                        <button onclick="polishWithLmStudio('natural')"
                            class="px-2.5 py-1 rounded-lg bg-violet-500/15 hover:bg-violet-500/30 border border-violet-500/35 text-[11px] font-bold text-violet-200 transition-all">
                            Natural
                        </button>
                        <button onclick="polishWithLmStudio('formal')"
                            class="px-2.5 py-1 rounded-lg bg-violet-500/15 hover:bg-violet-500/30 border border-violet-500/35 text-[11px] font-bold text-violet-200 transition-all">
                            Formal
                        </button>
                        <button onclick="polishWithLmStudio('casual')"
                            class="px-2.5 py-1 rounded-lg bg-violet-500/15 hover:bg-violet-500/30 border border-violet-500/35 text-[11px] font-bold text-violet-200 transition-all">
                            Casual
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <!-- AI Tone Note / Alternative Meanings -->
        <div id="ai-polish-box" class="hidden glass-panel rounded-3xl p-5 border border-violet-500/30 bg-violet-500/5 space-y-2"></div>

        <section id="alternatives-box" class="hidden glass-panel rounded-3xl p-6 space-y-4"></section>

        <!-- Quick Sample Phrases & Account-Private History -->
        <section class="glass-panel rounded-3xl p-5 space-y-3">
            <div class="flex flex-wrap items-center gap-2">
                <span class="text-[11px] font-bold uppercase tracking-wider text-slate-400 mr-1">Quick Phrases:</span>
                <button onclick="loadSamplePhrase('Bonjour! Comment vas-tu aujourd’hui?', 'fr', 'en')"
                    class="px-3 py-1 rounded-full bg-white/5 hover:bg-emerald-500/20 border border-white/10 hover:border-emerald-500/40 text-xs text-slate-300 transition-all">
                    FR → EN Greeting
                </button>
                <button onclick="loadSamplePhrase('Where is the nearest train station, please?', 'en', 'fr')"
                    class="px-3 py-1 rounded-full bg-white/5 hover:bg-emerald-500/20 border border-white/10 hover:border-emerald-500/40 text-xs text-slate-300 transition-all">
                    EN → FR Travel
                </button>
                <button onclick="loadSamplePhrase('谢谢你的帮助，祝你有美好的一天！', 'zh-CN', 'en')"
                    class="px-3 py-1 rounded-full bg-white/5 hover:bg-emerald-500/20 border border-white/10 hover:border-emerald-500/40 text-xs text-slate-300 transition-all">
                    中文 → EN Thanks
                </button>
                <button onclick="loadSamplePhrase('El conocimiento es poder.', 'es', 'fr')"
                    class="px-3 py-1 rounded-full bg-white/5 hover:bg-emerald-500/20 border border-white/10 hover:border-emerald-500/40 text-xs text-slate-300 transition-all">
                    ES → FR Proverb
                </button>
            </div>

            <div id="history-section" class="hidden pt-3 border-t border-white/10 space-y-2.5">
                <div class="flex items-center justify-between">
                    <span id="history-owner-label" class="text-[11px] font-bold uppercase tracking-wider text-cyan-300 flex items-center gap-1.5">
                        <i class="fa-solid fa-lock text-[10px]"></i>
                        <span>Private History</span>
                    </span>
                    <button onclick="clearHistory()" class="text-[11px] font-semibold text-rose-300 hover:text-rose-200 flex items-center gap-1">
                        <i class="fa-solid fa-trash-can text-[10px]"></i>
                        <span>Clear Private History</span>
                    </button>
                </div>
                <div id="history-list" class="grid grid-cols-1 sm:grid-cols-2 gap-2.5"></div>
            </div>
        </section>

    </div>

    <script>
        const LANG_LIST = [
            { code: 'en', name: 'English (EN)', speech: 'en-US', dir: 'ltr' },
            { code: 'fr', name: 'Français (FR)', speech: 'fr-CA', dir: 'ltr' },
            { code: 'es', name: 'Español (ES)', speech: 'es-ES', dir: 'ltr' },
            { code: 'de', name: 'Deutsch (DE)', speech: 'de-DE', dir: 'ltr' },
            { code: 'it', name: 'Italiano (IT)', speech: 'it-IT', dir: 'ltr' },
            { code: 'pt', name: 'Português (PT)', speech: 'pt-BR', dir: 'ltr' },
            { code: 'zh-CN', name: '中文 Simplified (ZH)', speech: 'zh-CN', dir: 'ltr' },
            { code: 'zh-TW', name: '中文 Traditional (TW)', speech: 'zh-TW', dir: 'ltr' },
            { code: 'ja', name: '日本語 Japanese (JA)', speech: 'ja-JP', dir: 'ltr' },
            { code: 'ko', name: '한국어 Korean (KO)', speech: 'ko-KR', dir: 'ltr' },
            { code: 'ar', name: 'العربية Arabic (AR)', speech: 'ar-SA', dir: 'rtl' },
            { code: 'hi', name: 'हिन्दी Hindi (HI)', speech: 'hi-IN', dir: 'ltr' },
            { code: 'tr', name: 'Türkçe Turkish (TR)', speech: 'tr-TR', dir: 'ltr' },
            { code: 'ru', name: 'Русский Russian (RU)', speech: 'ru-RU', dir: 'ltr' },
            { code: 'nl', name: 'Nederlands Dutch (NL)', speech: 'nl-NL', dir: 'ltr' },
            { code: 'pl', name: 'Polski Polish (PL)', speech: 'pl-PL', dir: 'ltr' },
            { code: 'sv', name: 'Svenska Swedish (SV)', speech: 'sv-SE', dir: 'ltr' },
            { code: 'la', name: 'Latina Latin (LA)', speech: 'it-IT', dir: 'ltr' },
            { code: 'el', name: 'Ελληνικά Greek (EL)', speech: 'el-GR', dir: 'ltr' }
        ];

        let debounceTimer = null;
        let lastTranslatedText = '';
        let lastDetectedLang = '';
        let currentUser = null;
        let translationHistory = [];

        function escapeHtml(str) {
            return String(str ?? '').replace(/[&<>"']/g, m => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[m]));
        }

        function getLangMeta(code) {
            return LANG_LIST.find(l => l.code.toLowerCase() === String(code).toLowerCase()) ||
                   LANG_LIST.find(l => l.code.split('-')[0] === String(code).split('-')[0]) ||
                   { code, name: code.toUpperCase(), speech: 'en-US', dir: 'ltr' };
        }

        function getAccountStorageKey() {
            if (!currentUser) return null;
            const idPart = currentUser.id ?? currentUser.user_id ?? currentUser.username;
            return `homenest_translator_history_${idPart}`;
        }

        async function loadPrivateHistory() {
            if (!currentUser) return;
            try {
                const res = await fetch('/api/history/translator');
                if (res.ok) {
                    const data = await res.json();
                    translationHistory = Array.isArray(data.items) ? data.items : [];
                    const key = getAccountStorageKey();
                    if (key) localStorage.setItem(key, JSON.stringify(translationHistory));
                    renderHistory();
                    return;
                }
            } catch (_) {}

            const key = getAccountStorageKey();
            translationHistory = key ? JSON.parse(localStorage.getItem(key) || '[]') : [];
            renderHistory();
        }

        function populateLanguageDropdowns() {
            const srcSel = document.getElementById('source-lang');
            const tgtSel = document.getElementById('target-lang');

            srcSel.innerHTML = `<option value="auto" class="bg-slate-900 text-emerald-300" selected>✨ Auto-Detect Language</option>` +
                LANG_LIST.map(l => `<option value="${l.code}" class="bg-slate-900 text-white">${escapeHtml(l.name)}</option>`).join('');

            tgtSel.innerHTML = LANG_LIST.map(l =>
                `<option value="${l.code}" class="bg-slate-900 text-white" ${l.code === 'fr' ? 'selected' : ''}>${escapeHtml(l.name)}</option>`
            ).join('');
        }

        async function verifyAuth() {
            // Remove legacy shared localStorage key so history is strictly per-account
            localStorage.removeItem('homenest_translator_history');

            try {
                const res = await fetch('/api/me');
                if (!res.ok) {
                    window.location.href = '/';
                    return;
                }
                currentUser = await res.json();
                document.getElementById('user-badge').innerText = `${currentUser.username} · ${currentUser.role}`;
                document.getElementById('history-owner-label').innerHTML = `
                    <i class="fa-solid fa-lock text-[10px]"></i>
                    <span>Private History (${escapeHtml(currentUser.username)})</span>
                `;
                await loadPrivateHistory();
            } catch (_) {
                window.location.href = '/';
            }
        }

        async function signOut() {
            await fetch('/api/logout', { method: 'POST' });
            window.location.href = '/';
        }

        function updateTextDirections() {
            const srcCode = document.getElementById('source-lang').value;
            const tgtCode = document.getElementById('target-lang').value;
            document.getElementById('source-text').dir = srcCode === 'auto' ? 'auto' : getLangMeta(srcCode).dir;
            document.getElementById('target-output').dir = getLangMeta(tgtCode).dir;
        }

        function onLangChanged() {
            updateTextDirections();
            if (document.getElementById('source-text').value.trim()) {
                translateText(true);
            }
        }

        function swapLanguages() {
            const srcSel = document.getElementById('source-lang');
            const tgtSel = document.getElementById('target-lang');
            const oldSrc = srcSel.value === 'auto' ? (lastDetectedLang || 'en') : srcSel.value;
            const oldTgt = tgtSel.value;

            srcSel.value = oldTgt;
            if ([...tgtSel.options].some(o => o.value === oldSrc)) {
                tgtSel.value = oldSrc;
            }

            if (lastTranslatedText) {
                document.getElementById('source-text').value = lastTranslatedText;
                updateCharCount();
            }
            updateTextDirections();
            if (document.getElementById('source-text').value.trim()) {
                translateText(true);
            }
        }

        function updateCharCount() {
            const len = document.getElementById('source-text').value.length;
            document.getElementById('char-count').innerText = `${len} / 5000`;
        }

        function handleSourceInput() {
            updateCharCount();
            clearTimeout(debounceTimer);
            const text = document.getElementById('source-text').value.trim();
            if (!text) {
                resetOutput();
                return;
            }
            debounceTimer = setTimeout(() => translateText(false), 450);
        }

        function resetOutput() {
            lastTranslatedText = '';
            document.getElementById('target-output').innerHTML = `<span class="text-slate-500 text-sm">Translation will appear here...</span>`;
            document.getElementById('source-romanization').classList.add('hidden');
            document.getElementById('target-romanization').classList.add('hidden');
            document.getElementById('detected-badge').classList.add('hidden');
            document.getElementById('alternatives-box').classList.add('hidden');
            document.getElementById('ai-polish-box').classList.add('hidden');
            document.getElementById('engine-tag').innerText = 'Ready';
        }

        function clearSource() {
            document.getElementById('source-text').value = '';
            updateCharCount();
            resetOutput();
            document.getElementById('source-text').focus();
        }

        async function pasteFromClipboard() {
            try {
                const clip = await navigator.clipboard.readText();
                if (clip) {
                    document.getElementById('source-text').value = clip.slice(0, 5000);
                    updateCharCount();
                    translateText(true);
                }
            } catch (_) {}
        }

        function copyTranslation() {
            if (!lastTranslatedText) return;
            navigator.clipboard.writeText(lastTranslatedText).then(() => {
                const lbl = document.getElementById('copy-label');
                lbl.innerText = 'Copied!';
                setTimeout(() => { lbl.innerText = 'Copy'; }, 1500);
            });
        }

        function speakText(side) {
            if (!('speechSynthesis' in window)) return;
            const text = side === 'source'
                ? document.getElementById('source-text').value.trim()
                : lastTranslatedText;
            if (!text) return;

            const langCode = side === 'source'
                ? (document.getElementById('source-lang').value === 'auto' ? (lastDetectedLang || 'en') : document.getElementById('source-lang').value)
                : document.getElementById('target-lang').value;

            window.speechSynthesis.cancel();
            const utter = new SpeechSynthesisUtterance(text);
            utter.lang = getLangMeta(langCode).speech;
            utter.rate = 0.96;
            window.speechSynthesis.speak(utter);
        }

        function loadSamplePhrase(text, src, tgt) {
            document.getElementById('source-lang').value = src;
            document.getElementById('target-lang').value = tgt;
            document.getElementById('source-text').value = text;
            updateCharCount();
            updateTextDirections();
            translateText(true);
        }

        async function saveHistory(srcText, tgtText, srcLang, tgtLang) {
            if (!currentUser || !srcText || !tgtText || srcText.length > 160) return;
            const entry = { srcText, tgtText, srcLang, tgtLang };
            translationHistory = [
                entry,
                ...translationHistory.filter(h => !(h.srcText === srcText && h.tgtLang === tgtLang))
            ].slice(0, 8);
            renderHistory();

            const key = getAccountStorageKey();
            if (key) localStorage.setItem(key, JSON.stringify(translationHistory));

            try {
                await fetch('/api/history/translator', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ item: entry })
                });
            } catch (_) {}
        }

        async function clearHistory() {
            translationHistory = [];
            renderHistory();
            const key = getAccountStorageKey();
            if (key) localStorage.removeItem(key);
            try {
                await fetch('/api/history/translator', { method: 'DELETE' });
            } catch (_) {}
        }

        function renderHistory() {
            const sec = document.getElementById('history-section');
            const list = document.getElementById('history-list');
            if (!translationHistory.length) {
                sec.classList.add('hidden');
                return;
            }
            sec.classList.remove('hidden');
            list.innerHTML = translationHistory.map((h, idx) => `
                <button type="button" onclick="restoreHistoryItem(${idx})"
                    class="text-left p-3 rounded-2xl bg-white/[0.03] hover:bg-white/[0.08] border border-white/10 transition-all space-y-1">
                    <div class="flex items-center justify-between text-[10px] font-mono text-slate-400 uppercase">
                        <span>${escapeHtml(h.srcLang)} → ${escapeHtml(h.tgtLang)}</span>
                        <span>Load ↵</span>
                    </div>
                    <div class="text-xs font-semibold text-slate-200 truncate">${escapeHtml(h.srcText)}</div>
                    <div class="text-xs text-cyan-300 truncate">${escapeHtml(h.tgtText)}</div>
                </button>
            `).join('');
        }

        function restoreHistoryItem(idx) {
            const item = translationHistory[idx];
            if (!item) return;
            loadSamplePhrase(item.srcText, item.srcLang, item.tgtLang);
        }

        async function translateViaGtx(text, sl, tl) {
            const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${encodeURIComponent(sl)}&tl=${encodeURIComponent(tl)}&dt=t&dt=bd&dt=rm&q=${encodeURIComponent(text)}`;
            const res = await fetch(url);
            if (!res.ok) throw new Error('GTX unavailable');
            const data = await res.json();

            let translated = '';
            let targetTranslit = '';
            let sourceTranslit = '';

            if (Array.isArray(data[0])) {
                for (const seg of data[0]) {
                    if (seg[0]) translated += seg[0];
                    if (seg[2]) targetTranslit += (targetTranslit ? ' ' : '') + seg[2];
                    if (seg[3]) sourceTranslit += (sourceTranslit ? ' ' : '') + seg[3];
                }
            }

            const detected = data[2] || sl;
            const alternatives = Array.isArray(data[1]) ? data[1] : [];
            return { translated, detected, targetTranslit, sourceTranslit, alternatives, engine: 'Google Translate' };
        }

        async function translateViaMyMemory(text, sl, tl) {
            const srcPair = sl === 'auto' ? 'en' : sl;
            const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${encodeURIComponent(srcPair)}|${encodeURIComponent(tl)}`;
            const res = await fetch(url);
            if (!res.ok) throw new Error('MyMemory unavailable');
            const data = await res.json();
            const translated = data?.responseData?.translatedText || '';
            if (!translated) throw new Error('Empty translation');
            return { translated, detected: srcPair, targetTranslit: '', sourceTranslit: '', alternatives: [], engine: 'MyMemory' };
        }

        async function translateText(saveToHistory = false) {
            const rawText = document.getElementById('source-text').value.trim();
            if (!rawText) {
                resetOutput();
                return;
            }

            const sl = document.getElementById('source-lang').value;
            const tl = document.getElementById('target-lang').value;
            const outEl = document.getElementById('target-output');
            const engineTag = document.getElementById('engine-tag');

            engineTag.innerText = 'Translating...';
            document.getElementById('ai-polish-box').classList.add('hidden');

            try {
                let result;
                try {
                    result = await translateViaGtx(rawText.slice(0, 5000), sl, tl);
                } catch (_) {
                    result = await translateViaMyMemory(rawText.slice(0, 500), sl, tl);
                }

                lastTranslatedText = result.translated;
                lastDetectedLang = result.detected;
                outEl.innerText = result.translated;
                engineTag.innerText = result.engine;

                const detBadge = document.getElementById('detected-badge');
                if (sl === 'auto' && result.detected) {
                    detBadge.innerText = `Detected: ${getLangMeta(result.detected).name}`;
                    detBadge.classList.remove('hidden');
                } else {
                    detBadge.classList.add('hidden');
                }

                const srcRom = document.getElementById('source-romanization');
                if (result.sourceTranslit) {
                    srcRom.innerText = result.sourceTranslit;
                    srcRom.classList.remove('hidden');
                } else {
                    srcRom.classList.add('hidden');
                }

                const tgtRom = document.getElementById('target-romanization');
                if (result.targetTranslit) {
                    tgtRom.innerText = result.targetTranslit;
                    tgtRom.classList.remove('hidden');
                } else {
                    tgtRom.classList.add('hidden');
                }

                const altBox = document.getElementById('alternatives-box');
                if (result.alternatives && result.alternatives.length) {
                    altBox.innerHTML = `
                        <h3 class="text-sm font-extrabold text-white flex items-center gap-2">
                            <i class="fa-solid fa-layer-group text-emerald-400"></i>
                            <span>Alternative Translations &amp; Word Forms</span>
                        </h3>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                            ${result.alternatives.map(group => {
                                const pos = group[0] || 'term';
                                const words = Array.isArray(group[1]) ? group[1].slice(0, 8) : [];
                                return `
                                    <div class="p-3.5 rounded-2xl bg-white/[0.03] border border-white/10 space-y-2">
                                        <span class="text-[11px] font-bold uppercase tracking-wider text-indigo-300">${escapeHtml(pos)}</span>
                                        <div class="flex flex-wrap gap-1.5">
                                            ${words.map(w => `
                                                <span class="px-2.5 py-1 rounded-lg bg-emerald-500/15 border border-emerald-500/30 text-emerald-100 text-xs font-medium">
                                                    ${escapeHtml(w)}
                                                </span>
                                            `).join('')}
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    `;
                    altBox.classList.remove('hidden');
                } else {
                    altBox.classList.add('hidden');
                }

                if (saveToHistory) {
                    await saveHistory(rawText, result.translated, sl === 'auto' ? result.detected : sl, tl);
                }
            } catch (err) {
                engineTag.innerText = 'Offline';
                outEl.innerHTML = `<span class="text-rose-300 text-sm">Translation failed. Check your internet connection or use AI Tone Polish with LM Studio.</span>`;
            }
        }

        async function polishWithLmStudio(tone) {
            const rawText = document.getElementById('source-text').value.trim();
            if (!rawText) return;

            const tl = document.getElementById('target-lang').value;
            const targetName = getLangMeta(tl).name;
            const box = document.getElementById('ai-polish-box');
            box.classList.remove('hidden');
            box.innerHTML = `<div class="text-xs text-violet-200 flex items-center gap-2"><i class="fa-solid fa-circle-notch fa-spin"></i> <span>Generating ${escapeHtml(tone)} translation via LM Studio...</span></div>`;

            const prompt = `Translate the following text into ${targetName} using a ${tone} tone. Return ONLY the translated text without quotes or explanations:\n\n${rawText}`;
            const payload = {
                model: 'local-model',
                messages: [{ role: 'user', content: prompt }],
                temperature: 0.3,
                max_tokens: 700
            };

            try {
                let res = await fetch('/api/ai/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (res.status === 404) {
                    res = await fetch('http://localhost:1234/v1/chat/completions', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                }
                if (!res.ok) throw new Error('LM Studio offline');
                const data = await res.json();
                const polished = data.choices[0].message.content.trim();

                lastTranslatedText = polished;
                document.getElementById('target-output').innerText = polished;
                document.getElementById('engine-tag').innerText = `LM Studio (${tone})`;

                box.innerHTML = `
                    <div class="flex items-center justify-between text-xs text-violet-300 font-bold">
                        <span><i class="fa-solid fa-wand-magic-sparkles mr-1.5"></i>Applied ${escapeHtml(tone)} rewrite via local LM Studio</span>
                    </div>
                `;
            } catch (_) {
                box.innerHTML = `<span class="text-xs text-rose-300">LM Studio is not running on port 1234. Start the local server in LM Studio to use AI Tone Polish.</span>`;
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            populateLanguageDropdowns();
            updateTextDirections();
            verifyAuth();
        });
    </script>
</body>
